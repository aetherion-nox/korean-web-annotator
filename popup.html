<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korean Hanja & Loanword Annotator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="topbar">
      <h1 data-i18n="title">韩语汉字·外来语标注</h1>
      <label class="language-picker" title="简体中文 / 繁體中文 / 日本語 / 한국어 / English">
        <span class="language-hint" aria-hidden="true">简 / 繁 / 日 / 한 / EN</span>
        <select id="uiLocale" aria-label="简体中文 / 繁體中文 / 日本語 / 한국어 / English">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>

    <label class="choice"><input id="hanjaMode" type="checkbox" checked><span data-i18n="hanjaMode">汉字词：用汉字替换正文中的对应韩文</span></label>
    <label class="choice"><input id="loanwordMode" type="checkbox" checked><span data-i18n="loanwordMode">外来语：在韩文正上方显示原词</span></label>

    <fieldset id="annotationAppearancePanel" class="annotation-appearance">
      <legend data-appearance-i18n="heading">标注样式</legend>
        <label for="annotationSize"><span data-appearance-i18n="size">标注大小（相对正文）</span> <output id="annotationSizeValue">75%</output></label>
        <input id="annotationSize" type="range" min="25" max="150" step="1" value="75">
        <label for="annotationOpacity"><span data-appearance-i18n="opacity">标注深浅（不透明度）</span> <output id="annotationOpacityValue">100%</output></label>
        <input id="annotationOpacity" type="range" min="0" max="100" step="1" value="100">
        <div id="annotationAppearancePreview" class="annotation-appearance-preview" aria-label="Preview"><ruby>韓國<rt>한국</rt></ruby>의 <ruby>文化<rt>문화</rt></ruby>와 <ruby>커피<rt>coffee</rt></ruby></div>
        <button id="resetAnnotationAppearance" type="button" data-appearance-i18n="reset">恢复默认</button>
        <p class="appearance-hint" data-appearance-i18n="hint">仅调整上方标注文字，正文不变。已有标注立即生效，无需重新分析。</p>
        <p id="annotationAppearanceStatus" role="status"></p>
    </fieldset>

    <fieldset class="copy-settings">
      <legend>选择与复制文字时</legend>
      <label class="choice"><input type="radio" name="copyMode" value="base"><span data-i18n="copyBase">只复制当前显示的正文</span></label>
      <label class="choice"><input type="radio" name="copyMode" value="annotated"><span data-i18n="copyAnnotated">复制正文和标注</span></label>
      <label class="choice"><input type="radio" name="copyMode" value="hangul" checked><span data-i18n="copyHangul">只复制原韩语（谚文）</span></label>
      <label class="choice"><input type="radio" name="copyMode" value="annotation"><span data-i18n="copyAnnotation">只复制上方标注</span></label>
    </fieldset>

    <label class="choice"><input id="stopAutoAfterPageComplete" type="checkbox" checked><span>整页完成后停止自动标注</span></label>
    <label class="choice"><input id="restoreExistingAnnotations" type="checkbox" checked><span data-i18n="restoreExistingAnnotations">动态网页兼容：恢复已有标注</span></label>
    <p class="setting-hint" data-i18n="recoveryHint">网页重绘后复用已有结果补回标注，不重新调用模型；与停止自动标注分开控制。</p>
    <label class="choice"><input id="hideToolbarOnFirstManual" type="checkbox" checked><span data-i18n="hideToolbarOnFirstManual">手动填写框首次弹出时隐藏工具条</span></label>
    <label class="choice"><input id="clearCacheOnExit" type="checkbox"><span>退出浏览器后清除标注缓存</span></label>
    <p class="setting-hint">关闭后跨浏览器会话保留本地分析和模型审核缓存；网页重绘恢复与此独立。缓存仍受容量及匹配条件限制。</p>
    <label class="choice force-choice"><input id="forceRegenerate" type="checkbox"><span data-i18n="forceRegenerate">本次忽略缓存，重新分析文本</span></label>
    <label class="choice">工具条显示 <select id="toolbarDisplay"><option value="selection">选中文字时显示</option><option value="always">始终显示</option></select></label>
    <label class="choice"><input id="hideToolbarOnCompletion" type="checkbox" checked aria-describedby="hideToolbarOnCompletionHint"><span data-i18n="hideToolbarOnCompletion">标注完成后自动收起工具条</span></label>
    <p id="hideToolbarOnCompletionHint" class="setting-hint" data-i18n="hideToolbarOnCompletionHint">正常完成后收起；可按工具条显示设置重新选中文字，或点击已启用的悬浮球重新打开。</p>
    <label class="choice"><input id="toolbarBallOnly" type="checkbox" aria-describedby="toolbarBallOnlyHint"><span data-i18n="toolbarBallOnly">仅点击悬浮球显示工具条</span></label>
    <p id="toolbarBallOnlyHint" class="setting-hint" data-i18n="toolbarBallOnlyHint">选中文字时不自动显示；开启时自动启用网页工具条和悬浮球。</p>
    <label class="choice mobile-choice"><input id="mobileSelectionToolbar" type="checkbox" checked><span data-i18n="mobileToolbar">启用网页工具条</span></label>
    <label class="choice"><input id="floatingBallEnabled" type="checkbox" checked><span data-i18n="floatingBall">可拖动悬浮球（点击打开工具条）</span></label>

    <label class="choice"><input id="toolbarHangulOnly" type="checkbox" checked><span>仅检测到谚文时显示悬浮球和工具条</span></label>

    <div class="buttons">
      <button id="selectionButton" class="primary" data-i18n="annotateSelection">标注所选文字</button>
      <button id="runButton" data-i18n="annotatePage">一键标注整页</button>
      <button id="reviewSelectionButton">模型重审选区</button>
      <button id="undoButton" data-i18n="undo">撤销一步</button>
      <button id="redoButton" data-i18n="redo">重做一步</button>
      <p id="historySteps" class="history-steps" role="status" aria-live="polite">撤销 0 步 · 重做 0 步</p>
      <button id="restoreButton" class="danger-subtle" data-i18n="restore">清除全部标注</button>
      <button id="clearCacheButton" class="danger-subtle" data-i18n="clearCache">清除标注缓存</button>
    </div>

    <button id="optionsButton" class="link-button" data-i18n="apiSettings">引擎 / API 设置</button>
    <p id="status" role="status"></p>
  </main>
  <script src="popup.js"></script>
  <script type="module" src="annotation-appearance-settings.js"></script>
</body>
</html>
