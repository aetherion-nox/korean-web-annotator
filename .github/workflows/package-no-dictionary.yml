name: Verify and Package Frame-Aware Full-Page Annotation v9 (regression rerun)
on:
  push:
    branches:
      - fix/v1.1.55.4-frame-aware-page-annotation
    paths:
      - .github/workflows/package-no-dictionary.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: package-v1.1.55.4-frame-aware-page-annotation
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and opt-in implementation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['version']=='1.1.55.4'
          assert Path('no-dictionary-analysis.js').is_file()
          assert 'experimentalHanja' in Path('service-worker.js').read_text()
          print('Experimental no-dictionary patch based on v1.1.55.4')
          PY
      - name: Restore pinned Kiwi and Python assets
        run: |
          python3 restore_distribution.py
          git restore runtime/python-sources.json
      - name: Run full regression suite and new no-dictionary tests
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          PYTHONPATH=python/browser-support npm test
      - name: Build and verify extension ZIP
        run: |
          python3 - <<'PY'
          import subprocess,zipfile,json,hashlib
          from pathlib import Path
          root=Path.cwd()
          tracked=[Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          files={p for p in tracked if p.parts[0] not in {'.github','distribution','tests','scripts'}
                 and p.name!='restore_distribution.py' and (root/p).is_file()}
          for folder in ('runtime','icons'):
              files.update(p.relative_to(root) for p in (root/folder).rglob('*') if p.is_file())
          dest=root/'Korean-Web-Annotator-v1.1.55.4-no-dictionary.zip'
          with zipfile.ZipFile(dest,'w',allowZip64=True) as z:
              for p in sorted(files):
                  mode=zipfile.ZIP_STORED if p.suffix.lower()=='.mdl' else zipfile.ZIP_DEFLATED
                  z.write(root/p,'Korean-Web-Annotator/'+p.as_posix(),
                          compress_type=mode,compresslevel=6 if mode==zipfile.ZIP_DEFLATED else None)
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              required=['manifest.json','content.js','service-worker.js','no-dictionary-analysis.js',
                  'browser-worker.js','engine-page.js','runtime/models/nounchr.mdl','runtime/python-sources.json']
              assert all('Korean-Web-Annotator/'+p in z.namelist() for p in required)
              assert json.loads(z.read('Korean-Web-Annotator/manifest.json'))['version']=='1.1.55.4'
          assert dest.stat().st_size>90_000_000, 'Incomplete Kiwi runtime'
          print('ZIP:',dest,'size:',dest.stat().st_size,'SHA256:',hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: no-dictionary-extension-zip
          path: Korean-Web-Annotator-v1.1.55.4-no-dictionary.zip
          compression-level: 0
          if-no-files-found: error
  windows-verify-publish:
    runs-on: windows-latest
    needs: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: no-dictionary-extension-zip
          path: artifact
      - name: Verify complete extraction on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Get-ChildItem artifact -Filter '*.zip' -File | Select-Object -First 1).FullName
          if(-not $zip){throw 'ZIP missing'}
          $dest=Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force -ErrorAction Stop
          $manifest=Get-ChildItem $dest -Recurse -Filter manifest.json -File | Select-Object -First 1
          $mdl=Get-ChildItem $dest -Recurse -Filter cong.mdl -File | Select-Object -First 1
          $module=Get-ChildItem $dest -Recurse -Filter no-dictionary-analysis.js -File | Select-Object -First 1
          if(-not $manifest -or -not $mdl -or -not $module){throw 'Extracted extension incomplete'}
          if($mdl.Length -ne 75854705){throw "Unexpected Kiwi model length: $($mdl.Length)"}
          $sevenZip=Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if(Test-Path $sevenZip){
            & $sevenZip t $zip
            if($LASTEXITCODE -ne 0){throw "7-Zip failed: $LASTEXITCODE"}
          }
          Write-Host "Windows extraction verified: $($mdl.Length) byte cong.mdl"
      - name: Publish Windows-verified independent prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v1.1.55.4-frame-aware-compatible.1'
          $zip=(Get-ChildItem artifact -Filter '*.zip' -File | Select-Object -First 1).FullName
          gh release view $tag --repo 'aetherion-nox/korean-web-annotator' 1>$null 2>$null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag $zip --repo 'aetherion-nox/korean-web-annotator' --clobber
          } else {
            gh release create $tag $zip --repo 'aetherion-nox/korean-web-annotator' --target $env:GITHUB_SHA --title 'v1.1.55.4 — frame-aware complete page annotation and sidebars (Windows compatible)' --prerelease --notes 'Whole-page starts now enumerate child frames and only start those with eligible visible Korean content, with bounded late frame discovery, document-aware deduplication and permission-safe skips. Match-origin fallback covers related frames. Includes the previous fixes for the old 3000-node whole-page truncation, cross-location identical-text deduplication and hidden/tab visibility handling. Detects open Shadow DOM, optionally observes visibility attribute changes and adds a bounded one-time asynchronous hydration follow-up without disabling stop-auto. Includes detailed DOM scan versus model/DOM render diagnostics. Atomic segmentation repairs now validate before old target choices, allow omitting results for safely superseded targets and scan-only placeholders, remove artificial KEEP fragments, reject KEEP additions, allow delete without origin, and preserve fallback old choices if repairs fail. Manual reviews, retries and disconnected-page recovery use the shared repair validator. Includes previous dictionary-backed experiment. Open-origin JSON mode explicitly allows genuine Hanja or Latin spellings only when an enabled source type has no matching dictionary candidate. Matching dictionary senses still use c/n choice IDs; KEEP remains fallback and all existing validators are unchanged. Includes default-on Hanja reading verification toggle, lexical alternate-reading checks, keeps all structural safety checks when disabled, prevents unsafe noun merging, preserves native suffixes, safely normalizes nonconflicting empty-ID repair additions, and reports distinct origin validation/render statistics. Includes previous manual DOM rendering fix. Includes prior open-origin protocol changes. Includes prior analyzeLocal import fix. Experimental Kiwi-only lexical targets when no external dictionary is imported. Requires model review and an enabled Hanja or loanword literal-origin experiment. Keeps normal imported dictionary behavior. Includes partial manual recovery. Kiwi model files are ZIP STORED; Windows Expand-Archive verified.'
          }
          if($LASTEXITCODE -ne 0){throw 'GitHub Release failed'}
