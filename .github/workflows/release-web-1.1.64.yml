name: Publish Web v1.1.64
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test code
        run: |
          node --check engine-page.js
          node --check batch-budget.js
          node --check browser-worker.js
          node --check model-origin.js
          node --check segmentation-rescue.js
          node --check review-merge.js
          node --check review-payload.js
          node --check model-origin.js
          node --check review-boundary.js
          node --check choice-review.js
          node --check model-stream.js
          python3 -m py_compile python/backend/risk_review.py python/backend/analysis.py python/backend/loanwords.py
          node --check local-engine.js
          node --check review-payload.js
          node --check annotation-pipeline.js
          node --check content.js
          node --check manual-review.js
          node --check batch-budget.js
          node --check options.js
          node --check api-profiles.js
          node --check service-worker.js
          node --check engine-settings.js
          node --test tests/unlisted-compound-recovery.test.mjs tests/large-window-batching.test.mjs tests/chunk-review.test.mjs tests/real-page-boundaries.test.mjs tests/risk-review.test.mjs tests/single-hangul-guard.test.mjs tests/model-segmentation.test.mjs tests/manual-segmentation-batch.test.mjs tests/browser-worker-failure.test.mjs tests/model-origin.test.mjs tests/model-origin-settings.test.mjs tests/review-pos.test.mjs tests/name-homograph-payload.test.mjs tests/manual-continuation.test.mjs
          PYTHONPATH=python/browser-support python3 tests/test_unlisted_lexical_recovery.py
          PYTHONPATH=python/browser-support python3 tests/test_real_page_boundaries.py
          PYTHONPATH=python/browser-support python3 tests/test_risk_review.py
          PYTHONPATH=python/browser-support python3 tests/test_single_hangul_guard.py
          PYTHONPATH=python/browser-support python3 tests/test_name_ambiguity.py
          PYTHONPATH=python/browser-support python3 tests/test_dictionary_names.py
      - name: Restore runtime
        run: python3 restore_distribution.py
      - name: Refresh Pyodide Python source bundle and build ZIP
        run: |
          python3 - <<'PY'
          import json,zipfile,hashlib,subprocess
          from pathlib import Path
          root=Path.cwd()
          f=root/'runtime/python-sources.json'
          old=json.loads(f.read_text())
          for key in list(old):
              if not key.startswith('/project/'):continue
              local=root/'python'/key[len('/project/'):]
              if local.is_file():old[key]=local.read_text()
          path='/project/backend/name_homographs.py'
          old[path]=(root/'python/backend/name_homographs.py').read_text()
          old['/project/backend/risk_review.py']=(root/'python/backend/risk_review.py').read_text()
          f.write_text(json.dumps(old,ensure_ascii=False,separators=(',',':')))
          files=set(Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)) if p)
          files={p for p in files if p.parts[0] not in {'.github','distribution'} and p.name!='restore_distribution.py' and (root/p).is_file()}
          for folder in ['runtime','icons']:
              files.update(p.relative_to(root) for p in (root/folder).rglob('*') if p.is_file())
          dest=root/'Korean-Web-Annotator-v1.1.64.zip'
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(files):z.write(root/p,'Korean-Web-Annotator/'+p.as_posix())
          with zipfile.ZipFile(dest) as z:
              assert not z.testzip()
              assert json.loads(z.read('Korean-Web-Annotator/manifest.json'))['version']=='1.1.64'
              assert 'Korean-Web-Annotator/runtime/python-sources.json' in z.namelist()
          print(dest.stat().st_size,hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.64 >/dev/null 2>&1; then
            gh release upload v1.1.64 Korean-Web-Annotator-v1.1.64.zip --clobber
          else
            gh release create v1.1.64 Korean-Web-Annotator-v1.1.64.zip --target "$GITHUB_SHA" --title "Korean Web Annotator v1.1.64" --notes-file CHANGELOG-1.1.64.md --latest
          fi
          gh release edit v1.1.64 --title "Korean Web Annotator v1.1.64" --notes-file CHANGELOG-1.1.64.md
