name: Diagnose live Vector TOC and collapsed DOM
on:
  push:
    branches:
      - fix/v1.1.56.32-real-bottlenecks-and-folded-toc
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live DOM with Chrome
        run: |
          command -v google-chrome || command -v chromium || true
          python3 -m pip install beautifulsoup4 --quiet
          python3 - <<'PY'
          import urllib.request
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://ko.wikisource.org/wiki/%EB%8C%80%ED%95%9C%EB%AF%BC%EA%B5%AD%ED%97%8C%EB%B2%95_(%EC%A0%9C10%ED%98%B8)'
          headers={'User-Agent':'KoreanWebAnnotatorInspect/1.1 (https://github.com/aetherion-nox/korean-web-annotator)'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
            content=response.read().decode('utf-8')
          open('toc-page.html','w').write(content)
          soup=BeautifulSoup(content,'html.parser')
          print('STATIC_DOCUMENT_BYTES',len(content))
          for link in soup.select('link[rel=stylesheet]')[:8]:
            href=link.get('href')
            if not href:continue
            cssurl=urljoin(url,href)
            try:
              with urllib.request.urlopen(urllib.request.Request(cssurl,headers=headers),timeout=25) as response:css=response.read().decode('utf-8')
              print('FETCHED_CSS',len(css),cssurl[:220])
              if 'vector-toc-list' in css:
                open('toc-styles.css','w').write(css)
                for i in range(min(css.count('vector-toc-list'),6)):
                  idx=css.find('vector-toc-list',0 if i==0 else idx+1)
                  print('CSS_VECTOR_RULE',css[max(0,idx-100):idx+210][:310])
                break
            except Exception as ex: print('CSS_FETCH_ERROR',str(ex)[:180])
          PY
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core
          cat > /tmp/inspect-toc.mjs <<'SCRIPT'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          const fs=await import('node:fs');
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          await page.route('**/*',route=>route.abort());
          await page.setContent(fs.readFileSync('toc-page.html','utf8'),{waitUntil:'domcontentloaded'});
          if(fs.existsSync('toc-styles.css'))await page.addStyleTag({path:'toc-styles.css'});
          console.log('PAGE_HTML_BODY',JSON.stringify({title:await page.title(),bodyLength:await page.locator('body').innerText().then(v=>v.length)}));
          const inspect=()=>page.evaluate(()=>{
            const sub=document.querySelector('#toc-조문-sublist');
            const els=[...document.querySelectorAll('.vector-toc-list')];
            const trail=e=>{const result=[];while(e&&result.length<12){
              const c=getComputedStyle(e);
              result.push({tag:e.tagName,id:e.id,cls:String(e.className).slice(0,180),display:c.display,visibility:c.visibility,contentVisibility:c.contentVisibility,ariaHidden:e.getAttribute('aria-hidden'),hidden:e.hidden});
              e=e.parentElement;
            }return result;};
            return {url:location.href,allSubLists:els.length,subListText:sub?.innerText?.slice(0,100),htmlText:sub?.textContent?.slice(0,100),trail:sub?trail(sub):null,
              firstList:els[0]?trail(els[0]):null,button:document.querySelector('#toc-조문 .vector-toc-toggle')?.outerHTML,
              dropdowns:document.querySelectorAll('[aria-expanded]').length};
          });
          console.log('BEFORE',JSON.stringify(await inspect()));
          await page.evaluate(()=>{
            const li=document.querySelector('#toc-조문');
            li?.classList.remove('vector-toc-list-item-expanded');
            document.querySelector('#toc-조문-sublist')?.setAttribute('aria-hidden','true');
          });
          console.log('FOLDED_SIMULATED',JSON.stringify(await inspect()));
          console.log('AFTER',JSON.stringify(await inspect()));
          await browser.close();
          SCRIPT
          cp /tmp/inspect-toc.mjs inspect-toc.mjs
          node inspect-toc.mjs
