name: Inspect Chosun Article HTML (one-off)
on:
  push:
    branches:
      - fix/v1.1.55.4-dynamic-page-full-scan
    paths:
      - .github/workflows/inspect-chosun-article.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install light HTML inspection dependencies
        run: python -m pip install requests beautifulsoup4 lxml
      - name: Download exact article HTML and inspect target text origins
        run: python scripts/probe-chosun-article.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chosun-article-html-source
          path: chosun-probe/*.html
          if-no-files-found: warn
          retention-days: 2
