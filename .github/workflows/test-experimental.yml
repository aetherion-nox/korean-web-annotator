name: Smart Segmentation / Candidate Review Checks
on:
  push:
    branches: [experimental-sense-options-from-v1.1.55]
    paths:
      - '**.js'
      - '**.mjs'
      - '**.py'
      - 'runtime/python-sources.json'
      - 'package.json'
      - '.github/workflows/test-experimental.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Selective local review backend
        run: PYTHONPATH=python/browser-support python3 tests/test_selective_review.py
      - name: Candidate and pipeline protocol regressions
        run: node --test tests/selective-local-review.test.mjs tests/experimental-options.test.mjs tests/name-homograph-payload.test.mjs
      - name: Restore bundled Kiwi model assets for runtime tests
        run: |
          python3 restore_distribution.py
          git restore runtime/python-sources.json
      - name: Full repository regression suite
        run: PYTHONPATH=python/browser-support npm test
      - name: Verify bundled Python matches source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          bundle=json.loads(Path('runtime/python-sources.json').read_text())
          for path in [
              'python/backend/analysis.py',
              'python/browser-support/browser_bridge.py',
              'python/backend/upstream/scripts/import_dictionary.py',
          ]:
              key='/project/'+path[len('python/'):]
              assert bundle[key]==Path(path).read_text(), path
          print('bundled sources match')
          PY
      - name: Package loadable extension ZIP
        run: |
          python3 - <<'PY'
          import json, subprocess, zipfile
          from pathlib import Path
          root=Path.cwd()
          tracked=[Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          files={p for p in tracked if p.parts[0] not in {'.github','distribution','tests'} and p.name!='restore_distribution.py' and (root/p).is_file()}
          for folder in ('runtime','icons'):
              files.update(p.relative_to(root) for p in (root/folder).rglob('*') if p.is_file())
          dest=root/'Korean-Web-Annotator-v1.1.55.1-smart-segmentation-experimental.zip'
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for path in sorted(files):archive.write(root/path,'Korean-Web-Annotator/'+path.as_posix())
          with zipfile.ZipFile(dest) as archive:
              assert archive.testzip() is None
              assert 'Korean-Web-Annotator/runtime/models/nounchr.mdl' in archive.namelist()
              assert 'Korean-Web-Annotator/runtime/python-sources.json' in archive.namelist()
              assert json.loads(archive.read('Korean-Web-Annotator/manifest.json'))['version']=='1.1.55.1'
          print('Installable ZIP:',dest.name,dest.stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Korean-Web-Annotator-Selective-Review-Test-Build
          path: Korean-Web-Annotator-v1.1.55.1-smart-segmentation-experimental.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
