name: Package v1.1.55.4 Partial Manual Recovery
on:
  push:
    branches:
      - fix/v1.1.55.4-partial-manual-recovery
    paths:
      - .github/workflows/package-offline-origins.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: package-v1.1.55.4-partial-manual-recovery
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version and source
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['version']=='1.1.55.4'
          assert 'hanja-reading-check.js' in m['web_accessible_resources'][0]['resources']
          assert 'partial-manual-recovery' in os.environ['GITHUB_REF_NAME']
          print('Correct experimental base and offline origin patch')
          PY
      - name: Restore verified Kiwi runtime files
        run: |
          python3 restore_distribution.py
          git restore runtime/python-sources.json
      - name: Run focused regressions
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          node --test tests/manual-continuation.test.mjs tests/manual-partial-review.test.mjs tests/experimental-options.test.mjs
          PYTHONPATH=python/browser-support npm test
      - name: Package installable extension
        run: |
          python3 - <<'PY'
          import json,subprocess,zipfile,hashlib
          from pathlib import Path
          root=Path.cwd()
          tracked=[Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          files={p for p in tracked if p.parts[0] not in {'.github','distribution','tests'} and p.name!='restore_distribution.py' and (root/p).is_file()}
          for folder in ('runtime','icons'):
              files.update(p.relative_to(root) for p in (root/folder).rglob('*') if p.is_file())
          dest=root/'Korean-Web-Annotator-v1.1.55.4-partial-manual-recovery.zip'
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(files):z.write(root/p,'Korean-Web-Annotator/'+p.as_posix())
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              required=['manifest.json','content.js','annotation-pipeline.js',
                'hanja-reading-check.js','hanja-reading-data.js',
                'runtime/models/nounchr.mdl','runtime/python-sources.json']
              assert all('Korean-Web-Annotator/'+p in z.namelist() for p in required)
              m=json.loads(z.read('Korean-Web-Annotator/manifest.json'))
              assert m['version']=='1.1.55.4'
          assert dest.stat().st_size>90_000_000, 'Kiwi runtime missing from ZIP'
          print('ZIP:',dest,'Bytes:',dest.stat().st_size,'SHA256:',hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - name: Publish separate prerelease, preserve original release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.55.4-partial-manual-recovery.1'
          ASSET='Korean-Web-Annotator-v1.1.55.4-partial-manual-recovery.zip'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
              --title 'v1.1.55.4 Partial Manual Recovery (Experimental)' \
              --prerelease \
              --notes 'Based on v1.1.55.4, this experimental patch extends offline model-origin recovery with per-target manual review, saved valid decisions, partial preview, and smaller prompts for only missing or invalid target IDs. Existing v1.1.55.4 release and stable branch are unchanged.'
          fi
